<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Title - Blog</title>

  <!-- Global Meta Referrer Policy: Suppresses Referer across all page events -->
  <meta name="referrer" content="no-referrer">

  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      color: #333;
    }
    .blog-post {
      background: #f9f9f9;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .action-button {
      display: inline-block;
      background-color: #0066cc;
      color: #ffffff;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      margin-top: 20px;
      transition: background 0.3s ease;
    }
    .action-button:hover {
      background-color: #004999;
    }
  </style>
</head>
<body>

  <div class="blog-post">
    <h1>Understanding Modern Web Technologies</h1>
    <p>This is an example blog article. Users interact with the content naturally before clicking the button below to visit the requested service.</p>

    <!-- 🎯 THE ULTIMATE FIX: HTML Link replacement forces browser native routing -->
    <!-- target="_blank" guarantees exactly ONE new tab, rel="noreferrer" hides your website completely -->
    <a href="https://pu.edu.pk/" 
       id="directAccessBtn" 
       class="action-button" 
       target="_blank" 
       rel="noreferrer noopener" 
       referrerpolicy="no-referrer">
      Visit Destination Domain
    </a>
  </div>

  <script>
    // Safe memory handler inside your existing script block
    document.getElementById('directAccessBtn').addEventListener('click', function(e) {
      try {
        // Erase browser storage trails before moving to next tab
        window.localStorage.clear();
        window.sessionStorage.clear();
      } catch(error) {}
      
      // We do NOT block default link action, letting browser open exactly one new tab naturally
    });
  </script>

</body>
</html>
